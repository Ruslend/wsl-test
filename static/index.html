<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OfficeFlow</title><link rel="stylesheet" href="/styles.css"></head><body><header class="topbar"><div><span class="eyebrow">CORPORATE SERVICE DESK</span><h1>OfficeFlow</h1><p>Внутренняя система заявок сотрудников</p></div><button id="open-form" class="primary">+ Новая заявка</button></header><main><section class="stats"><article><span>Всего</span><strong id="stat-total">0</strong></article><article><span>Новые</span><strong id="stat-new">0</strong></article><article><span>В работе</span><strong id="stat-progress">0</strong></article><article><span>Выполнено</span><strong id="stat-done">0</strong></article></section><section class="panel"><div class="toolbar"><div><h2>Заявки</h2><p>IT, доступы, оборудование и внутренние сервисы</p></div><div class="filters"><input id="search" type="search" placeholder="Поиск по заявкам"><select id="status-filter"><option value="">Все статусы</option><option value="new">Новые</option><option value="in_progress">В работе</option><option value="done">Выполнено</option></select></div></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Заявка</th><th>Отдел</th><th>Приоритет</th><th>Статус</th><th>Действие</th></tr></thead><tbody id="ticket-list"></tbody></table></div><p id="empty-state" class="empty" hidden>Заявок нет.</p></section></main><dialog id="ticket-dialog"><form id="ticket-form"><div class="dialog-head"><div><span class="eyebrow">НОВАЯ ЗАЯВКА</span><h2>Что требуется?</h2></div><button type="button" id="close-form" class="icon-button">×</button></div><label>Заголовок<input name="title" required maxlength="100"></label><div class="form-grid"><label>Отдел<input name="department" required maxlength="60"></label><label>Сотрудник<input name="requester" required maxlength="60"></label></div><label>Приоритет<select name="priority"><option value="low">Низкий</option><option value="medium" selected>Средний</option><option value="high">Высокий</option></select></label><label>Описание<textarea name="description" rows="4"></textarea></label><p id="form-error" class="error"></p><button class="primary full" type="submit">Создать заявку</button></form></dialog><script src="/app.js" defer></script></body></html>
